global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: scylla
    static_configs:
      - targets: ["scylladb:9180"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
